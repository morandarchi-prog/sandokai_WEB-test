{
  "name": "Publier le site FR-EN sur GitHub Pages",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "github-pages",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read",
        "pages": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        },
        {
          "name": "Lire la configuration GitHub Pages",
          "id": "pages",
          "uses": "actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b"
        },
        {
          "name": "Verifier les pages et les articles",
          "run": "python3 -X utf8 -m unittest discover -s tests -v"
        },
        {
          "name": "Construire le site francais et anglais",
          "run": "python3 -X utf8 tools/build.py",
          "env": {
            "SANDOKAI_SITE_URL": "${{ steps.pages.outputs.base_url }}"
          }
        },
        {
          "name": "Preparer les pages a publier",
          "uses": "actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b",
          "with": {
            "path": "_site"
          }
        }
      ]
    },
    "deploy": {
      "runs-on": "ubuntu-latest",
      "needs": "build",
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "name": "Publier le site genere",
          "id": "deployment",
          "uses": "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e"
        }
      ]
    }
  }
}
